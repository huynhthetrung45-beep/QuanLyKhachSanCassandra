# NFR-19: CI chay kiem thu backend (Cassandra gia lap) + build frontend moi lan push / pull request.
name: ChatOTT CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
